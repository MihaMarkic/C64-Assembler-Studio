    app-id: com.rthand.C64AssemblerStudio
    runtime: org.freedesktop.Platform
    runtime-version: '25.08'
    sdk: org.freedesktop.Sdk
    sdk-extensions:
      - org.freedesktop.Sdk.Extension.openjdk21
    build-options:
      append-path: "/usr/lib/sdk/openjdk21/bin"
    command: C64AssemblerStudio
    finish-args:
        - --device=dri
        # TODO: Replace this with wayland and fallback-x11 once Wayland support
        #       becomes available:
        #       https://github.com/AvaloniaUI/Avalonia/pull/8003
        - --socket=x11
        - --share=ipc
        - --filesystem=home
        - --filesystem=host
        - --share=network
        - "--env=JAVA_HOME=/app/jre"
        - "--env=JAVA_OPTS=--enable-native-access=ALL-UNNAMED"
    modules:
      - name: openjdk
        buildsystem: simple
        build-commands:
          - /usr/lib/sdk/openjdk21/install.sh

      - name: C64AssemblerStudio,
        buildsystem: simple
        build-commands:
          - cp -r . ${FLATPAK_DEST}/bin
        sources:
          - type: dir
            path: ../../../src/C64AssemblerStudio/publish/linux_x64